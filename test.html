<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sommaire Cliquable</title>
<style>
.formation {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.formation-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 3px solid #7F77DD;
  padding-left: 12px;
}

.annees {
  font-size: 12px;
  color: #888;
}

.ville {
  font-size: 13px;
  color: #555;
}
</style>
</head>
<body>
<div class="formation">

  <div class="formation-item">
    <span class="annees">2018 – 2022</span>
    <strong>Collège Jules Verne</strong>
    <span class="ville">Varces-Allières-et-Risset, Isère</span>
  </div>

  <div class="formation-item">
    <span class="annees">2022 – 2025</span>
    <strong>Lycée Polyvalent Jacques Vaucanson</strong>
    <span class="ville">Grenoble, Isère</span>
  </div>

  <div class="formation-item">
    <span class="annees">2025 – maintenant</span>
    <strong>IUT2</strong>
    <span class="ville">Grenoble, Isère</span>
  </div>

</div>

</body>
</html>
